name: Deploy Chat (Next.js) to Cloudflare

# On hold (see PLAN.md, "Superseded"): runs only when started by hand.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # chat is a git submodule — pull its contents

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build with OpenNext
        run: pnpm run cf:build

      - name: Deploy to Cloudflare
        run: pnpm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Add any chat-specific secrets (e.g. auth provider keys) the
          # same way — as repo/environment secrets, referenced here.
