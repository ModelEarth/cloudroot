# Site config for pages served from CloudRoot (formerly /webroot.yaml).
# localsite.js (loadWebrootYaml) reads only /support/site/config.yaml.

# Sign-in widget and API, both from the CloudRoot Worker and the auth repo.
# On cloud.model.earth the Worker serves /auth/ (auth submodule) and /api/.
# Locally, chat/server.mjs serves /auth/ from the auth submodule, and the API
# is the Worker run locally: `npm run dev` in worker/ (http://localhost:3701).

default: model.earth

# The voice widget on pages with #fullscreen (engine, project/goals): talk to Claude there, with
# its controls in the lower right of #fullscreen (initFullscreenVoice() in localsite/js/localsite.js).
fullscreenVoice: /engine/claude-voice.js

auth:
  plugin_url_development: /auth/js/auth-plugin.js
  modal_url_development: /auth/js/auth-modal.js
  api_url_development: http://localhost:3701/api
  plugin_url_production: /auth/js/auth-plugin.js
  modal_url_production: /auth/js/auth-modal.js
  api_url_production: /api

sites:
  model.earth:
    title: "Model Earth"
    base_url: "https://model.earth"
    logo: "https://model.earth/localsite/img/logo/modelearth/model-earth.png"
    favicon: "/localsite/img/logo/modelearth/model-earth.png"
  neighborhood.org:
    title: "Neighborhood"
    base_url: "https://neighborhood.org"
    domain_contains: "neighborhood.org"
    favicon: "/localsite/img/logo/neighborhood/favicon.png"
    # The earth icon in the header in place of the logo, left of the site title (localsite/js/navigation.js)
    header_icon: earth
    visibility: "local"
  maestro:
    title: "Maestro"
    base_url: "https://neighborhood.org"
    home_url: "https://tsqatl.maestropro.io"
    domain_contains: "maestro"
    logo: "https://tsqatl.maestropro.io/common/brand.png"
    logo_height: "70px"
    favicon: "https://tsqatl.maestropro.io/favicon.ico"
    sideNavLive: false

# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Edit My Page

# Content is stored in each visitor's own fork of DesktopFolders/content. localsite's
# launchCMS callers (localsite/edit "Edit Files" and the Markdown "Edit Content" menu) sign in,
# create the fork if needed, and set backend.repo to it, so edits never go to this repo.
backend:
  name: github
  repo: DesktopFolders/content
  branch: main

media_folder: img
public_folder: /img

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: posts
    create: true
    # One full-width editing pane; the preview can still be opened from the editor's menu.
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }

# CMS - read by localsite/js/cms.js into window.CMS_SITE_CONFIG
cms:
  app_title: "Site Editor"
  inline_editor: true
  # GitHub sign-in relay for Sveltia CMS and localsite/edit's content tools: the Worker's
  # /api/cms/auth (automation/README.md, "CMS sign-in"). It posts the token only to its own
  # origin or one in ALLOWED_ORIGINS (worker/wrangler.toml).
  auth_base_url: "https://cloud.model.earth"
  auth_endpoint: "api/cms/auth"
  logo:
    show_in_header: false
    show_in_intro: false
  extra_css:
    - "/localsite/css/base.css"
  extra_js:
    - "/localsite/js/localsite.js?showheader=true&showsearch=false"