name = "cloudroot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The website and its API on one origin: https://cloud.model.earth
# (and https://cloudroot.<subdomain>.workers.dev).
workers_dev = true
routes = [
  { pattern = "cloud.model.earth", custom_domain = true },
]

# Static files: the webroot assembled by scripts/build-static.mjs.
# Only /api/* and /sanity/* run the Worker code first; every other path is
# served straight from these files.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/sanity", "/sanity/*"]
html_handling = "auto-trailing-slash"

# Secrets (LLM keys, BETTER_AUTH_SECRET, POSTGRES_URL, OAuth clients, ...)
# are NOT set here. They're pushed at deploy time from GitHub Actions
# secrets — see .github/workflows/deploy-worker.yml and README.md.

[vars]
# Other origins whose pages may call this API from a browser, with cookies.
# Pages served by this Worker are same-origin and need no entry.
ALLOWED_ORIGINS = "https://model.earth,http://localhost:3700,http://localhost:8887,http://localhost:8888"

# `npm run dev`: serve on localhost rather than presenting requests as
# cloud.model.earth (wrangler's default when a custom domain is set).
[dev]
port = 8787
host = "localhost:8787"
