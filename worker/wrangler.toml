name = "cloudroot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The website and its API, each domain its own origin: https://cloud.model.earth
# and https://neighborhood.org (and https://cloudroot.<subdomain>.workers.dev).
# Every deploy makes the Worker's custom domains match this list, so a domain
# added only in the Cloudflare dashboard is removed on the next push to main.
workers_dev = true
routes = [
  { pattern = "cloud.model.earth", custom_domain = true },
  { pattern = "neighborhood.org", custom_domain = true },
]

# Static files: the webroot itself (this folder's parent), minus what
# ../.assetsignore leaves out. /api/*, /ingest/* (tonic's transcript webhook)
# and /auth/* (the auth export, src/index.js) run the Worker code first;
# every other path is served straight from these files.
[assets]
directory = ".."
binding = "ASSETS"
run_worker_first = ["/api/*", "/ingest/*", "/auth", "/auth/*"]
html_handling = "auto-trailing-slash"

# Secrets (LLM keys, BETTER_AUTH_SECRET, POSTGRES_URL, OAuth clients, ...)
# are NOT set here. They're pushed at deploy time from GitHub Actions
# secrets — see .github/workflows/deploy-worker.yml and README.md.

[vars]
# Other origins whose pages may call this API from a browser, with cookies.
# Pages served by this Worker are same-origin and need no entry.
ALLOWED_ORIGINS = "https://model.earth,http://localhost:3700,http://localhost:3701,http://localhost:8887,http://localhost:8888"
# Where tonic's transcript webhook opens pull requests (tonic/README.md).
ARCHIVIST_REPO = "Earthscape/archivist1"

# `npm run dev`: serve on localhost rather than presenting requests as
# cloud.model.earth (wrangler's default when a custom domain is set).
# 3701 sits beside CloudRoot's 3700; 8787 is reserved for other local work.
[dev]
port = 3701
host = "localhost:3701"
